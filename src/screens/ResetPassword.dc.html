<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campus app – Set a new password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2448C9;text-decoration:none}a:hover{color:#16308F}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#8A93A6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>

<div style="position: relative; width: 390px; min-height: {{minH}}; box-sizing: border-box; background: #13235B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0E1726; display: flex; flex-direction: column; overflow-x: clip">

  <!-- Opened from the email link, so the header has the brand, not a back button -->
  <header style="padding: 28px 24px 40px; display: flex; align-items: center; gap: 12px; color: #FFFFFF">
    <span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <img src="/_blob/d18d465b4769a29a78cdbd57de8676e7" alt="IIT Roorkee logo" style="width: 44px; height: 44px; object-fit: contain">
    </span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.3px">IITR Campus</span>
      <span style="font-size: 12px; color: #C9D2EC">Account: 23114012</span>
    </div>
  </header>

  <main style="flex: 1; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 32px 24px 32px; display: flex; flex-direction: column; gap: 24px">

    <!-- ===== New password ===== -->
    <sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
      <div style="margin: 0; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.3px">Set a new password</h1>
          <span style="font-size: 14px; line-height: 1.5; color: #5B6577">Choose a password you haven’t used before. You’ll use it the next time you log in.</span>
        </div>

        <!-- New password -->
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="np-1" class="sr">New password</label>
          <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 6px 0 14px; border-radius: 14px; border: 1.5px solid #E3E7F0; background: #FFFFFF">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
            <input id="np-1" type="{{p1Type}}" autoComplete="new-password" value="{{p1}}" onChange="{{onP1}}" placeholder="Enter a new password" aria-describedby="np-rules" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #0E1726; font-family: inherit; font-size: 15px; font-weight: 600">
            <button type="button" onClick="{{toggleP1}}" aria-label="{{p1Label}}" aria-pressed="{{p1Pressed}}" style="width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 10px; background: transparent; color: #5B6577; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{p1Hidden}}" hint-placeholder-val="{{true}}">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </sc-if>
              <sc-if value="{{p1Shown}}" hint-placeholder-val="{{false}}">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.4 3.3M6.6 6.6A17.6 17.6 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"></path></svg>
              </sc-if>
            </button>
          </div>

          <!-- Live password rules -->
          <ul id="np-rules" aria-label="Password requirements" style="margin: 2px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
            <sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
              <li style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: {{r.ink}}">
                <span aria-hidden="true" style="width: 16px; height: 16px; flex-shrink: 0; border-radius: 50%; background: {{r.dotBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>
                </span>
                <span>{{r.label}}<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{r.sr}}</span></span>
              </li>
            </sc-for>
          </ul>
        </div>

        <!-- Confirm -->
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="np-2" class="sr">Re-enter new password</label>
          <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 6px 0 14px; border-radius: 14px; border: {{p2Border}}; background: #FFFFFF">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6577" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
            <input id="np-2" type="{{p2Type}}" autoComplete="new-password" value="{{p2}}" onChange="{{onP2}}" placeholder="Re-enter the new password" aria-invalid="{{p2Invalid}}" aria-describedby="np-2-msg" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #0E1726; font-family: inherit; font-size: 15px; font-weight: 600">
            <button type="button" onClick="{{toggleP2}}" aria-label="{{p2Label}}" aria-pressed="{{p2Pressed}}" style="width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 10px; background: transparent; color: #5B6577; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{p2Hidden}}" hint-placeholder-val="{{true}}">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </sc-if>
              <sc-if value="{{p2Shown}}" hint-placeholder-val="{{false}}">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.4 3.3M6.6 6.6A17.6 17.6 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"></path></svg>
              </sc-if>
            </button>
          </div>
          <sc-if value="{{hasP2Msg}}" hint-placeholder-val="{{false}}">
            <span id="np-2-msg" role="status" style="font-size: 12px; font-weight: 600; color: {{p2MsgInk}}">{{p2Msg}}</span>
          </sc-if>
        </div>

        <sc-if value="{{hasFormError}}" hint-placeholder-val="{{false}}">
          <p role="alert" style="margin: -4px 0 0; padding: 10px 12px; border-radius: 12px; background: #FDE7E4; font-size: 13px; font-weight: 600; line-height: 1.45; color: #7A1A12">{{formError}}</p>
        </sc-if>

        <button type="button" onClick="{{save}}" style="height: 52px; border-radius: 14px; border: 0; background: {{saveBg}}; color: #FFFFFF; font-size: 15px; font-weight: 700">Update password</button>
      </div>
    </sc-if>

    <!-- ===== Done ===== -->
    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 24px; text-align: center">
        <span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 50%; background: #E3F8EC; color: #067647; display: flex; align-items: center; justify-content: center">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>
        </span>
        <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.3px">Password updated</h1>
        <span style="font-size: 14px; line-height: 1.5; color: #5B6577">Your password has been changed. Log in with your new password to continue.</span>
        <a href="{{loginHref}}" style="align-self: stretch; margin-top: 8px; height: 52px; border-radius: 14px; background: #13235B; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Log in</a>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["form","done"],"default":"form"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: props.step || 'form', p1: '', p2: '', show1: false, show2: false, tried: false };
  }
  renderVals() {
    const S = this.state;
    const checks = [
      { label: 'At least 8 characters', ok: S.p1.length >= 8 },
      { label: 'Includes a letter and a number', ok: /[a-z]/i.test(S.p1) && /\d/.test(S.p1) },
      { label: 'Not your enrollment number', ok: S.p1.length > 0 && !S.p1.includes('23114012') }
    ];
    const rulesOk = checks.every((c) => c.ok);
    const match = S.p2.length > 0 && S.p1 === S.p2;
    const mismatch = S.p2.length > 0 && S.p1 !== S.p2;
    const ready = rulesOk && match;

    let formError = '';
    if (S.tried && !ready) {
      if (!S.p1) formError = 'Enter a new password.';
      else if (!rulesOk) formError = 'Your new password doesn’t meet all the requirements yet.';
      else if (!S.p2) formError = 'Re-enter your new password.';
      else formError = 'The passwords don’t match.';
    }

    return {
      isForm: S.step === 'form',
      isDone: S.step === 'done',

      p1: S.p1,
      onP1: (e) => this.setState({ p1: e.target.value, tried: false }),
      p1Type: S.show1 ? 'text' : 'password',
      p1Hidden: !S.show1, p1Shown: S.show1,
      p1Pressed: S.show1 ? 'true' : 'false',
      p1Label: S.show1 ? 'Hide new password' : 'Show new password',
      toggleP1: () => this.setState({ show1: !S.show1 }),

      p2: S.p2,
      onP2: (e) => this.setState({ p2: e.target.value, tried: false }),
      p2Type: S.show2 ? 'text' : 'password',
      p2Hidden: !S.show2, p2Shown: S.show2,
      p2Pressed: S.show2 ? 'true' : 'false',
      p2Label: S.show2 ? 'Hide re-entered password' : 'Show re-entered password',
      toggleP2: () => this.setState({ show2: !S.show2 }),
      p2Border: mismatch ? '1.5px solid #D92D20' : match ? '1.5px solid #12893F' : '1.5px solid #E3E7F0',
      p2Invalid: mismatch ? 'true' : 'false',
      hasP2Msg: S.p2.length > 0,
      p2Msg: match ? 'Passwords match' : 'Passwords don’t match',
      p2MsgInk: match ? '#067647' : '#B42318',

      rules: checks.map((c) => ({
        label: c.label,
        sr: c.ok ? ', met' : ', not met',
        ink: c.ok ? '#067647' : '#5B6577',
        dotBg: c.ok ? '#12893F' : '#C9D2EC'
      })),

      hasFormError: !!formError,
      formError,
      saveBg: '#13235B',
      // Prototype: dummy data, so any input updates the password.
      // The rules and match check above still react live as guidance.
      save: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        this.setState({ step: 'done' });
      },
      loginHref: this.props.loginHref || 'Login.dc.html',
      minH: this.props.minH || '844px'
    };
  }
}
</script>
</body>
</html>
