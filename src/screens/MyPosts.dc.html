<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campus app – Your collaboration posts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2448C9;text-decoration:none}a:hover{color:#16308F}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>

<div style="position: relative; width: 390px; min-height: {{minH}}; box-sizing: border-box; background: #F3F5FA; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0E1726; display: flex; flex-direction: column; overflow-x: clip">

  <!-- Header: solid navy, stays put -->
  <header style="position: sticky; top: 0; z-index: 0; background: #13235B; padding: 16px 16px 64px; display: flex; flex-direction: column; gap: 16px; color: #FFFFFF">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="{{backHref}}" aria-label="Back to collaboration" style="width: 44px; height: 44px; border-radius: 14px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.2px">Your posts</h1>
        <span style="font-size: 12px; color: #C9D2EC">{{summary}}</span>
      </div>
    </div>
    <a href="{{postHref}}" style="height: 48px; border-radius: 14px; background: #FFFFFF; color: #13235B; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      Post a collaboration
    </a>
  </header>

  <!-- Content sheet -->
  <div style="position: relative; z-index: 1; margin-top: -28px; flex: 1; background: #F3F5FA; border-radius: 28px 28px 0 0; padding: 10px 16px 40px; box-shadow: 0 -10px 30px rgba(14,23,38,0.22); display: flex; flex-direction: column; gap: 12px">
    <div aria-hidden="true" style="width: 40px; height: 5px; margin: 0 auto 6px; border-radius: 3px; background: #C9D2EC"></div>

    <sc-for list="{{posts}}" as="p" hint-placeholder-count="3">
      <article aria-label="{{p.title}}, {{p.statusLabel}}" style="background: #FFFFFF; border: 1px solid #E3E7F0; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; opacity: {{p.opacity}}">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span style="display: flex; gap: 6px">
            <span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: {{p.tagBg}}; color: {{p.tagFg}}">{{p.type}}</span>
            <span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: {{p.stBg}}; color: {{p.stFg}}">{{p.statusLabel}}</span>
          </span>
          <span style="font-size: 12px; color: #5B6577">{{p.meta}}</span>
        </div>
        <h2 style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3; letter-spacing: -0.2px">{{p.title}}</h2>

        <!-- "New" only shows when there are new profiles (same rule as the Collaboration carousel) -->
        <dl style="margin: 0; display: grid; grid-template-columns: {{p.cols}}; padding: 12px 0; border-top: 1px solid #EDF0F6; border-bottom: 1px solid #EDF0F6">
          <div style="display: flex; flex-direction: column; gap: 2px; padding-right: 12px">
            <dt style="font-size: 12px; font-weight: 600; color: #5B6577">Profiles</dt>
            <dd style="margin: 0; font-size: 22px; line-height: 1.1; font-weight: 800; color: #13235B">{{p.profiles}}</dd>
          </div>
          <sc-if value="{{p.hasNew}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 12px; border-left: 1px solid #EDF0F6">
              <dt style="font-size: 12px; font-weight: 600; color: #5B6577">New</dt>
              <dd style="margin: 0; font-size: 22px; line-height: 1.1; font-weight: 800; color: #2448C9">{{p.fresh}}</dd>
            </div>
          </sc-if>
          <div style="display: flex; flex-direction: column; gap: 2px; padding-left: 12px; border-left: 1px solid #EDF0F6">
            <dt style="font-size: 12px; font-weight: 600; color: #5B6577">Shortlisted</dt>
            <dd style="margin: 0; font-size: 22px; line-height: 1.1; font-weight: 800; color: #067647">{{p.short}}</dd>
          </div>
        </dl>

        <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px">
          <a href="{{respHref}}" aria-label="Manage responses for {{p.title}}" style="height: 44px; border-radius: 12px; background: #13235B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">Manage responses</a>
          <sc-if value="{{p.isOpen}}" hint-placeholder-val="{{true}}">
            <button type="button" onClick="{{p.close}}" aria-label="Close collaboration: {{p.title}}" style="height: 44px; border-radius: 12px; border: 1px solid #F5C2BC; background: #FFFFFF; color: #B42318; font-size: 13px; font-weight: 700">Close collaboration</button>
          </sc-if>
          <sc-if value="{{p.isClosed}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{p.reopen}}" aria-label="Reopen collaboration: {{p.title}}" style="height: 44px; border-radius: 12px; border: 1px solid #E3E7F0; background: #FFFFFF; color: #13235B; font-size: 13px; font-weight: 700">Reopen</button>
          </sc-if>
        </div>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1250}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // The SIH team post is already closed so both card states are visible
    this.state = { closed: { sih: true } };
  }
  renderVals() {
    const TYPE = {
      Project:   ['#DCE4FF', '#2448C9'],
      Research:  ['#C8F0D8', '#067647'],
      Hackathon: ['#FCE7B4', '#8A4B00'],
      Startup:   ['#FCE7F3', '#9D174D'],
      Others:    ['#EDF0F6', '#3A4456']
    };
    const RAW = [
      { id: 'mess', type: 'Project', title: 'Mess feedback app for hostels', posted: '2 days ago', due: '20 Nov', profiles: 4, fresh: 3, short: 1 },
      { id: 'badm', type: 'Others', title: 'Doubles partner for the inter-hostel badminton league', posted: '5 days ago', due: '18 Nov', profiles: 2, fresh: 2, short: 0 },
      { id: 'sih', type: 'Hackathon', title: 'Smart India Hackathon team (software track)', posted: '3 weeks ago', due: '30 Oct', profiles: 6, fresh: 0, short: 3 }
    ];
    const closed = this.state.closed;
    const posts = RAW.map((p) => {
      const isClosed = !!closed[p.id];
      return {
        ...p,
        meta: p.posted + ' | ' + (isClosed ? 'Closed' : 'Apply by ' + p.due),
        tagBg: TYPE[p.type][0], tagFg: TYPE[p.type][1],
        isOpen: !isClosed, isClosed,
        hasNew: p.fresh > 0,
        cols: p.fresh > 0 ? 'repeat(3, minmax(0, 1fr))' : 'repeat(2, minmax(0, 1fr))',
        statusLabel: isClosed ? 'Closed' : 'Open',
        stBg: isClosed ? '#EDF0F6' : '#E3F8EC',
        stFg: isClosed ? '#5B6577' : '#067647',
        opacity: isClosed ? '0.85' : '1',
        close: () => this.setState({ closed: { ...this.state.closed, [p.id]: true } }),
        reopen: () => this.setState({ closed: { ...this.state.closed, [p.id]: false } })
      };
    });
    const open = posts.filter((p) => p.isOpen).length;
    return {
      posts,
      summary: posts.length + ' posts | ' + open + ' open',
      backHref: this.props.backHref || 'Collab.dc.html',
      respHref: this.props.respHref || 'Responses.dc.html',
      postHref: this.props.postHref || 'PostCollab.dc.html',
      minH: this.props.minH || '844px'
    };
  }
}
</script>
</body>
</html>
