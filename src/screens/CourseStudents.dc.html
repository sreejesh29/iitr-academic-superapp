<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campus app – Course students</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2448C9;text-decoration:none}a:hover{color:#16308F}
input::placeholder{color:#C9D2EC}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>

<div style="position: relative; width: 390px; min-height: {{minH}}; box-sizing: border-box; background: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0E1726; display: flex; flex-direction: column; overflow-x: clip">

  <!-- Header: solid navy, stays put -->
  <header style="position: sticky; top: 0; z-index: 0; background: #13235B; padding: 16px 16px 64px; display: flex; flex-direction: column; gap: 16px; color: #FFFFFF">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="{{backHref}}" aria-label="Back to course info" style="width: 44px; height: 44px; border-radius: 14px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
        <h1 style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.2px">Students</h1>
        <span style="font-size: 12px; color: #C9D2EC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">CSN-341 | {{total}} enrolled</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 14px; background: rgba(255,255,255,0.12)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9D2EC" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="all-q" class="sr">Search students</label>
      <input id="all-q" type="search" placeholder="Search by name or enrolment no." style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px">
    </div>
  </header>

  <!-- Content sheet: full-width list, no card (same as the chatroom list) -->
  <div style="position: relative; z-index: 1; margin-top: -28px; flex: 1; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 0 40px; box-shadow: 0 -10px 30px rgba(14,23,38,0.22); display: flex; flex-direction: column; gap: 10px">
    <div aria-hidden="true" style="width: 40px; height: 5px; margin: 0 auto; border-radius: 3px; background: #C9D2EC"></div>

    <ul aria-label="All enrolled students" style="margin: 0; padding: 0 16px; list-style: none; background: #FFFFFF; border-bottom: 1px solid #EDF0F6; display: flex; flex-direction: column">
      <sc-for list="{{students}}" as="s" hint-placeholder-count="20">
        <li style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: {{s.divider}}">
          <sc-if value="{{s.isMe}}" hint-placeholder-val="{{false}}"><span style="position: relative; display: block; width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: #DCE4FF;"><img src="/_blob/d380e2b78f28a976382d51f88b9181ac" alt="" style="position: absolute; left: -205%; top: -46%; height: 300%; width: auto; max-width: none"></span></sc-if><sc-if value="{{s.notMe}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: {{s.avBg}}; color: {{s.avFg}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{s.initials}}</span></sc-if>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="display: flex; align-items: center; gap: 6px; min-width: 0">
              <span style="min-width: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
              <sc-if value="{{s.isMe}}" hint-placeholder-val="{{false}}">
                <span style="flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: #13235B; color: #FFFFFF">You</span>
              </sc-if>
            </span>
            <span style="font-size: 12px; color: #5B6577; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.enrol}} | {{s.program}}</span>
          </span>
        </li>
      </sc-for>
    </ul>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":4129}}'>
class Component extends DCLogic {
  renderVals() {
    // Same 64 students as CourseInfo: you first, then everyone else alphabetically.
    const PROGRAMS = [
      ['23114', 'B.Tech Computer Science and Engineering'],
      ['23116', 'B.Tech Electronics and Communication'],
      ['23115', 'B.Tech Electrical Engineering'],
      ['23535', 'B.Tech Data Science and AI']
    ];
    const FIRST = ['Riya', 'Kunal', 'Ananya', 'Ishaan', 'Meera', 'Sahil', 'Aditya', 'Kavya', 'Rohan', 'Neha', 'Arjun', 'Diya', 'Vikram', 'Sneha', 'Karan', 'Pooja', 'Rahul', 'Tanvi', 'Nikhil', 'Aisha', 'Harsh', 'Shreya', 'Manav', 'Ira', 'Dev', 'Nandini', 'Yash', 'Simran', 'Omkar', 'Lakshmi', 'Varun'];
    const LAST = ['Sharma', 'Pandey', 'Nair', 'Verma', 'Iyer', 'Gupta', 'Rao', 'Menon', 'Das', 'Joshi', 'Singh', 'Kulkarni', 'Reddy', 'Bose', 'Mishra', 'Chopra', 'Patel', 'Krishnan', 'Saxena', 'Bhat', 'Ghosh'];
    const AV = [['#FCE7F3', '#9D174D'], ['#E0F2FE', '#075985'], ['#EDE9FE', '#5B21B6'], ['#E3F8EC', '#067647'], ['#FFF4DB', '#8A4B00'], ['#DCE4FF', '#2448C9']];

    const others = [];
    for (let i = 0; i < 63; i++) {
      const first = FIRST[i % FIRST.length];
      const last = LAST[(i * 7 + 3) % LAST.length];
      const prog = PROGRAMS[i % 9 === 4 ? 1 : i % 11 === 6 ? 2 : i % 13 === 8 ? 3 : 0];
      const roll = prog[0] + String(101 + ((i * 37) % 180)).padStart(3, '0');
      others.push({ name: first + ' ' + last, enrol: roll, program: prog[1] });
    }
    others.sort((a, b) => a.name.localeCompare(b.name));
    const me = { name: 'Aarav Mehta', enrol: '23114012', program: PROGRAMS[0][1], isMe: true };
    const full = [me, ...others];

    const students = full.map((s, i) => {
      const parts = s.name.split(' ');
      const av = s.isMe ? ['#13235B', '#FFFFFF'] : AV[i % AV.length];
      return {
        ...s,
        isMe: !!s.isMe, notMe: !s.isMe,
        initials: parts[0][0] + parts[parts.length - 1][0],
        avBg: av[0], avFg: av[1],
        divider: i === 0 ? '0' : '1px solid #EDF0F6'
      };
    });

    return {
      students,
      total: full.length,
      backHref: this.props.backHref || 'CourseInfo.dc.html',
      minH: this.props.minH || '844px'
    };
  }
}
</script>
</body>
</html>
