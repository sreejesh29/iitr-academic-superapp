<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campus app – Phone preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scr{scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
</style>
</helmet>

<div style="width: 520px; height: 1000px; box-sizing: border-box; background: #E4E8F1; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">

  <!-- Device body -->
  <div style="position: relative; width: 414px; height: 868px; box-sizing: border-box; padding: 12px; border-radius: 60px; background: #0E1726; box-shadow: 0 40px 80px rgba(14,23,38,0.28), 0 0 0 2px #3A4456 inset">
    <span aria-hidden="true" style="position: absolute; left: -3px; top: 168px; width: 3px; height: 32px; border-radius: 2px 0 0 2px; background: #2A3346"></span>
    <span aria-hidden="true" style="position: absolute; left: -3px; top: 220px; width: 3px; height: 56px; border-radius: 2px 0 0 2px; background: #2A3346"></span>
    <span aria-hidden="true" style="position: absolute; right: -3px; top: 240px; width: 3px; height: 84px; border-radius: 0 2px 2px 0; background: #2A3346"></span>

    <!-- Screen -->
    <div style="position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #13235B">
      <!-- Status-bar safe area (fixed, navy) -->
      <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 54px; background: #13235B"></div>
      <!-- Scroll area: the header inside sticks to its top, the sheet slides over it -->
      <div class="scr" style="position: absolute; top: 54px; left: 0; right: 0; bottom: 0; z-index: 0; overflow-y: auto; overflow-x: hidden">
        <dc-import name="Main" hide-nav="{{true}}" att-href="AttendancePhone.dc.html" leave-href="LeavePhone.dc.html" mark-href="MarkAttendancePhone.dc.html" asg-href="AssignmentsPhone.dc.html" nb-href="NoticeboardPhone.dc.html" notif-href="NotificationsPhone.dc.html" profile-href="ProfilePhone.dc.html" id-href="IdCardPhone.dc.html" tt-href="TimetablePhone.dc.html" sm-href="StudyMaterialPhone.dc.html" collab-href="CollabPhone.dc.html" chats-href="ChatsPhone.dc.html" hint-size="390px,2950px"></dc-import>
      </div>

      <!-- Dynamic island -->
      <span aria-hidden="true" style="position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000000"></span>

      <!-- Fixed bottom nav -->
      <nav aria-label="Main" style="position: absolute; z-index: 10; left: 16px; right: 16px; bottom: 30px; height: 68px; box-sizing: border-box; padding: 8px; border-radius: 999px; background: #13235B; box-shadow: 0 12px 28px rgba(19,35,91,0.30); display: flex; align-items: center; justify-content: space-between">
        <a href="#" aria-current="page" style="height: 52px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; color: #13235B; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; text-decoration: none">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
          Home
        </a>
        <a href="TimetablePhone.dc.html" aria-label="Timetable" style="width: 52px; height: 52px; border-radius: 50%; color: #C9D2EC; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2.5"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
        </a>
        <a href="CoursesPhone.dc.html" aria-label="Courses" style="width: 52px; height: 52px; border-radius: 50%; color: #C9D2EC; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>
        </a>
        <a href="ChatsPhone.dc.html" aria-label="Chats, 12 unread" style="position: relative; width: 52px; height: 52px; border-radius: 50%; color: #C9D2EC; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <span aria-hidden="true" style="position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: #FF8A65; box-shadow: 0 0 0 2px #13235B"></span>
        </a>
        <a href="CollabPhone.dc.html" aria-label="Collaboration" style="width: 52px; height: 52px; border-radius: 50%; color: #C9D2EC; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </a>
      </nav>

      <!-- Home indicator -->
      <span aria-hidden="true" style="position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #0E1726"></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
