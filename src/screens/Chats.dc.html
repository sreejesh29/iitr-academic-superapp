<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campus app – Chatrooms</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2448C9;text-decoration:none}a:hover{color:#16308F}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input::placeholder{color:#C9D2EC}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>

<div style="position: relative; width: 390px; min-height: 844px; box-sizing: border-box; background: #F3F5FA; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0E1726; display: flex; flex-direction: column; overflow-x: clip">

  <!-- Header: solid navy, stays put while the sheet scrolls over it -->
  <header style="position: sticky; top: 0; z-index: 0; background: #13235B; padding: 24px 20px 64px; display: flex; flex-direction: column; gap: 20px; color: #FFFFFF">
    <div style="display: flex; align-items: center; gap: 2px">
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; padding-right: 8px">
        <h1 style="margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.3px">Chatrooms</h1>
        <span style="font-size: 12px; color: #C9D2EC">{{totals.rooms}} courses | {{totals.unread}} unread</span>
      </div>
      <a href="IdCard.dc.html" aria-label="Open digital ID card" style="width: 44px; height: 44px; border-radius: 14px; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"></rect><circle cx="8" cy="11" r="2"></circle><path d="M5 16a3 3 0 0 1 6 0M14 10h5M14 14h3"></path></svg>
      </a>
      <a href="Notifications.dc.html" aria-label="Notifications, 3 unread" style="position: relative; width: 44px; height: 44px; border-radius: 14px; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span aria-hidden="true" style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: #FF8A65; box-shadow: 0 0 0 2px #13235B"></span>
      </a>
      <a href="Profile.dc.html" aria-label="Profile" style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center"><span style="position: relative; display: block; width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: #DCE4FF; box-shadow: 0 0 0 2px #FFFFFF;"><img src="/_blob/d380e2b78f28a976382d51f88b9181ac" alt="" style="position: absolute; left: -205%; top: -46%; height: 300%; width: auto; max-width: none"></span></a>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 14px; background: rgba(255,255,255,0.12)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9D2EC" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="cq" class="sr">Search chatrooms</label>
      <input id="cq" type="search" placeholder="Search chatrooms and messages" style="flex: 1; border: 0; outline: none; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px">
    </div>
  </header>

  <!-- Content sheet -->
  <div style="position: relative; z-index: 1; margin-top: -28px; flex: 1; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 0 120px; box-shadow: 0 -10px 30px rgba(14,23,38,0.22)">
    <div aria-hidden="true" style="width: 40px; height: 5px; margin: 0 auto; border-radius: 3px; background: #C9D2EC"></div>

    <section aria-labelledby="rooms-h" style="margin: 18px 0 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 16px">
        <h2 id="rooms-h" style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.2px">Course chatrooms</h2>
        <span style="font-size: 13px; color: #5B6577">Each room has Announcements and Chat</span>
      </div>

      <ul style="margin: 0; padding: 0 16px; list-style: none; background: #FFFFFF; border-top: 1px solid #EDF0F6; border-bottom: 1px solid #EDF0F6; display: flex; flex-direction: column">
        <sc-for list="{{rooms}}" as="r" hint-placeholder-count="6">
          <li style="border-top: {{r.divider}}">
            <a href="{{roomHref}}" aria-label="{{r.label}}" style="display: flex; align-items: center; gap: 12px; padding: 14px 0; color: #0E1726">
              <span aria-hidden="true" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; background: {{r.avBg}}; color: {{r.avFg}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; letter-spacing: -0.2px">{{r.short}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
                  <span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
                  <span style="flex-shrink: 0; font-size: 12px; font-weight: {{r.timeWeight}}; color: {{r.timeInk}}">{{r.time}}</span>
                </span>
                <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                  <span style="min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5B6577">
                    <sc-if value="{{r.isAnn}}" hint-placeholder-val="{{false}}">
                      <span style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: #FFF4DB; color: #8A4B00">
                        <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1zM16 9a4 4 0 0 1 0 6"></path></svg>
                        Announcement
                      </span>
                    </sc-if>
                    <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><strong style="font-weight: 600; color: #3A4456">{{r.who}}:</strong> {{r.msg}}</span>
                  </span>
                  <sc-if value="{{r.hasUnread}}" hint-placeholder-val="{{false}}">
                    <span style="flex-shrink: 0; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; background: #2F5BEA; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.unread}}</span>
                  </sc-if>
                </span>              </span>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>
  </div>

  <!-- Floating bottom nav (hidden when a phone frame draws its own fixed copy) -->
  <sc-if value="{{showNav}}" hint-placeholder-val="{{true}}">
  <nav aria-label="Main" style="position: absolute; z-index: 10; left: 16px; right: 16px; bottom: 28px; height: 68px; box-sizing: border-box; padding: 8px; border-radius: 999px; background: #13235B; box-shadow: 0 12px 28px rgba(19,35,91,0.30); display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Home" style="width: 52px; height: 52px; border-radius: 50%; color: #C9D2EC; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
    </a>
    <a href="Timetable.dc.html" aria-label="Timetable" style="width: 52px; height: 52px; border-radius: 50%; color: #C9D2EC; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2.5"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
    </a>
    <a href="Courses.dc.html" aria-label="Courses" style="width: 52px; height: 52px; border-radius: 50%; color: #C9D2EC; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>
    </a>
    <a href="#" aria-current="page" aria-label="Chats, 12 unread" style="height: 52px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; color: #13235B; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">
      <span style="position: relative; display: flex">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span aria-hidden="true" style="position: absolute; top: -2px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: #FF8A65; box-shadow: 0 0 0 2px #FFFFFF"></span>
      </span>
      Chats
    </a>
    <a href="Collab.dc.html" aria-label="Collaboration" style="width: 52px; height: 52px; border-radius: 50%; color: #C9D2EC; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </a>
  </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // One room per enrolled course. Unread totals 12, matching the nav badge elsewhere.
    const RAW = [
      { code: 'CSN-341', short: 'CN', name: 'Computer Networks',        who: 'Prof. S. Iyer',  msg: 'Assignment 3 is due tonight at 11:59 PM', time: '10:12', unread: 3, ann: true },
      { code: 'CSN-345', short: 'SE', name: 'Software Engineering',     who: 'Meera J.',       msg: 'Sprint 2 demo slots are up on the sheet', time: '09:40', unread: 5 },
      { code: 'CSN-361', short: 'NL', name: 'Networks Lab',             who: 'Rahul V. (TA)',  msg: 'Lab 4 pre-lab sheet is mandatory today',  time: '08:55', unread: 2, ann: true },
      { code: 'MAN-301', short: 'PS', name: 'Probability & Statistics', who: 'Kunal P.',       msg: 'Can someone share the quiz syllabus?',      time: '08:20', unread: 1 },
      { code: 'HSN-351', short: 'MT', name: 'Management Techniques',    who: 'Prof. A. Ghosh', msg: 'Room moved to LHC 104 this week',           time: 'Yesterday', unread: 1, ann: true },
      { code: 'CSN-343', short: 'TC', name: 'Theory of Computation',    who: 'You',            msg: 'Thanks, that cleared it up!',               time: 'Mon', unread: 0 }
    ];
    const TINT = [
      ['#EEF2FF', '#2448C9'], ['#E3F8EC', '#067647'], ['#FFF4DB', '#8A4B00'],
      ['#FCE7F3', '#9D174D'], ['#EDE9FE', '#5B21B6'], ['#E0F2FE', '#075985']
    ];
    const rooms = RAW.map((r, i) => ({
      ...r,
      avBg: TINT[i % TINT.length][0],
      avFg: TINT[i % TINT.length][1],
      isAnn: !!r.ann,
      hasUnread: r.unread > 0,
      timeInk: r.unread ? '#2448C9' : '#697285',
      timeWeight: r.unread ? '700' : '500',
      divider: i === 0 ? '0' : '1px solid #EDF0F6',
      label: r.code + ' ' + r.name + (r.unread ? ', ' + r.unread + ' unread' : '') + '. Last message from ' + r.who + ': ' + r.msg
    }));
    const totals = { rooms: RAW.length, unread: RAW.reduce((s, r) => s + r.unread, 0) };
    return {
      rooms, totals,
      roomHref: this.props.roomHref || 'ChatRoom.dc.html',
      showNav: !this.props.hideNav
    };
  }
}
</script>
</body>
</html>
